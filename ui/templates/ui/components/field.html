{% comment %}
Composant Champ (texte) — label, aide, validation inline (erreur/succès).
Cf. ux-ui-design-v1.md §4. Sémantique HTML : <label for> lié à l'input,
message d'erreur relié via aria-describedby (lecteur d'écran).
{% endcomment %}
<div class="corrux-field{% if error %} corrux-field--error{% elif success %} corrux-field--success{% endif %}">
  <label for="{{ field_id }}" class="corrux-field__label">
    {{ label }}{% if required %}<span class="corrux-field__required" aria-hidden="true">*</span>{% endif %}
  </label>
  <input
    type="{{ input_type }}"
    id="{{ field_id }}"
    name="{{ name }}"
    class="corrux-field__input"
    {% if value %}value="{{ value }}"{% endif %}
    {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}
    {% if required %}required aria-required="true"{% endif %}
    {% if disabled %}disabled{% endif %}
    {% if error %}aria-invalid="true" aria-describedby="{{ field_id }}-message"{% elif help_text %}aria-describedby="{{ field_id }}-message"{% endif %}
  >
  {% if error %}
    <p id="{{ field_id }}-message" class="corrux-field__message">{{ error }}</p>
  {% elif success %}
    <p id="{{ field_id }}-message" class="corrux-field__message">{{ success }}</p>
  {% elif help_text %}
    <p id="{{ field_id }}-message" class="corrux-field__help">{{ help_text }}</p>
  {% endif %}
</div>
