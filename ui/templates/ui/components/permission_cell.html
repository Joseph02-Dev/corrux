{% load ui_tags %}
{% comment %}
Cellule togglable de la matrice de permissions — UI-202. Un formulaire
minimal, zéro JavaScript : la bascule est un aller-retour serveur.
{% endcomment %}
<form method="post" action="{{ toggle_url }}" class="corrux-permission-cell">
  {% csrf_token %}
  <input type="hidden" name="role_id" value="{{ role_id }}">
  <input type="hidden" name="module_id" value="{{ module_id }}">
  <input type="hidden" name="resource" value="{{ resource }}">
  <input type="hidden" name="action" value="{{ action }}">
  <button
    type="submit"
    class="corrux-permission-cell__toggle{% if granted %} corrux-permission-cell__toggle--on{% endif %}"
    aria-pressed="{% if granted %}true{% else %}false{% endif %}"
    aria-label="{% if granted %}Retirer{% else %}Accorder{% endif %} {{ module_id }}.{{ resource }}.{{ action }}"
  >{% if granted %}{% corrux_icon name="check" %}{% endif %}</button>
</form>
