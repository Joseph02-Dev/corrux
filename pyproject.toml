[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "corrux_core.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
filterwarnings = [
    # WhiteNoise signale STATIC_ROOT absent tant que `collectstatic` n'a
    # pas tourné — normal en test (fait par le postinst en production).
    "ignore:No directory at:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
